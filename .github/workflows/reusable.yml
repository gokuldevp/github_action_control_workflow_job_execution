name: reusable workflow

on:
  workflow_call: # This event allows the workflow to be called by other workflows, making it reusable across different contexts and projects
    inputs: # Define inputs that can be passed to the reusable workflow when it is called
        artifact-name: # Define an input named artifact-name
          description: 'The name of the artifact to upload' # Provide a description for the input
          required: false # Mark the input as required
          default: 'default-artifact' # Provide a default value for the input if not supplied by the caller
          type: string # Specify the type of the input, in this case, a string
    secrets:
        DEPLOYMENT_TOKEN: # Define a secret named DEPLOYMENT_TOKEN
            description: 'Token for deployment authentication' # Provide a description for the secret
            required: true # Mark the secret as required for the workflow to run
    outputs: # Define outputs that can be returned from the reusable workflow to the caller
        deployment-status: # Define an output named deployment-status
            description: 'The status of the deployment process' # Provide a description for the output
            value: ${{ jobs.deploy.outputs.status }} # Set the value of the output to reference the status output from the deploy job defined in this workflow, allowing the caller to access the deployment status after the workflow execution is complete


jobs:
    deploy:
        outputs:
            status: ${{ steps.id-deploy.outputs.status }} # Define an output for the deploy job that references the status output from the deploy step
        runs-on: ubuntu-latest
        steps:
        - name: Get Code
          uses: actions/download-artifact@v6
          with:
            name: ${{ inputs.artifact-name }} # Use the input value for the artifact name when checking out code
        - name: Output contents
          run: ls
        - name: Deploy to production
          run: echo "Deploying to production..."  # Placeholder for actual deployment commands
        - name: Set deployment status
          id: id-deploy
          run: echo "::set-output name=status::success"  # Set the deployment status output to 'success' for demonstration purposes, in a real scenario this would be based on the actual deployment outcome